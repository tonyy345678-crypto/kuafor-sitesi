<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Randevular</title>
<style>
body{margin:0;background:#121212;color:#f2efe9;font:16px system-ui,sans-serif}
main{max-width:520px;margin:auto;padding:20px 16px}
h2{color:#c9a45c;font-size:18px}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #2e2e2e;background:#1d1d1d;color:inherit;width:100%;margin-bottom:8px}
.r{background:#1d1d1d;border:1px solid #2e2e2e;border-radius:10px;padding:12px;margin-bottom:8px}
.r b{color:#c9a45c}.x{width:auto;padding:6px 12px;color:#e57373;margin:8px 0 0}
a{color:#c9a45c}
</style>
</head>
<body>
<main>
  <h2>Randevular</h2>
  <input id="pw" type="password" placeholder="Şifre">
  <input id="d" type="date">
  <button onclick="load()">Göster</button>
  <div id="out"></div>
</main>
<script>
const $ = (s) => document.getElementById(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
$("pw").value = sessionStorage.k || "";
$("d").value = new Date().toLocaleDateString("sv-SE");
async function call(q, m = "GET") {
  const r = await fetch("/api/admin?" + q, { method: m, headers: { "x-admin-key": $("pw").value } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Hata");
  return j;
}
async function load() {
  try {
    sessionStorage.k = $("pw").value;
    const { list } = await call("date=" + $("d").value);
    $("out").innerHTML = list.length ? list.map((b) =>
      `<div class="r"><b>${b.time}</b> · ${esc(b.berber)} · ${esc(b.service)} · ${b.fiyat} TL<br>${esc(b.name)} · <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>
       <br><button class="x" onclick="del('${esc(b.id)}')">İptal et</button></div>`).join("") : "<p>Bu gün için randevu yok.</p>";
  } catch (e) { $("out").textContent = e.message; }
}
async function del(id) {
  if (!confirm("Randevu iptal edilsin mi?")) return;
  try { await call("id=" + id, "DELETE"); load(); } catch (e) { alert(e.message); }
}
</script>
</body>
</html>
